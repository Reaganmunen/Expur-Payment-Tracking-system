<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New invoice · Expur</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3EE%3C/text%3E%3C/svg%3E"></head><body><div id="nav"></div><div class="container pb-5"><div id="alerts"></div>
<h4 class="mb-3">New invoice</h4>
<form id="f" class="card card-body shadow-sm"><div class="row g-3 mb-3">
<div class="col-md-4"><label class="form-label">Invoice no. <small class="text-muted">(from invoice book)</small></label><input id="inv" class="form-control" maxlength="50" placeholder="e.g. 0457" required></div>
<div class="col-md-4"><label class="form-label">Delivery note no. <small class="text-muted">(optional)</small></label><input id="dn" class="form-control" maxlength="50" placeholder="e.g. DN-1021"></div>
<div class="col-md-4"><label class="form-label">Invoice date</label><input id="idt" type="date" class="form-control"></div>
<div class="col-md-6"><label class="form-label">Customer</label><select id="cu" class="form-select" required></select></div>
<div class="col-md-3"><label class="form-label">Due date <small class="text-muted">(default +30 days)</small></label><input id="dd" type="date" class="form-control"></div>
<div class="col-md-3"><label class="form-label">Notes</label><input id="nt" class="form-control"></div></div>
<table class="table table-sm"><thead><tr><th>Product</th><th style="width:110px">Qty</th><th style="width:140px">Price</th><th class="text-end">Total</th><th></th></tr></thead><tbody id="it"></tbody></table>
<div class="d-flex justify-content-between"><button type="button" class="btn btn-outline-secondary btn-sm" onclick="addRow()">+ Add item</button><h5>Total: <span id="tt">KES 0</span></h5></div>
<button class="btn btn-primary mt-3">Create invoice</button></form>
</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script><script>
let P = [];
function addRow() { const tr = document.createElement('tr');
  tr.innerHTML = `<td><select class="form-select form-select-sm p">${P.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></td>
  <td><input type="number" min="0.01" step="0.01" value="1" class="form-control form-control-sm q"></td><td><input type="number" min="0" step="0.01" class="form-control form-control-sm u"></td>
  <td class="text-end t"></td><td><button type="button" class="btn-close" onclick="this.closest('tr').remove();calc()"></button></td>`;
  const price = () => { tr.querySelector('.u').value = P.find(p => p.id == tr.querySelector('.p').value).unit_price; calc(); };
  tr.querySelector('.p').onchange = price; tr.oninput = calc; it.appendChild(tr); price(); }
function calc() { let s = 0; it.querySelectorAll('tr').forEach(tr => { const v = tr.querySelector('.q').value * tr.querySelector('.u').value; tr.querySelector('.t').textContent = kes(v); s += v; }); tt.textContent = kes(s); }
f.onsubmit = async (e) => { e.preventDefault(); try {
  const items = [...it.querySelectorAll('tr')].map(tr => ({ product_id: +tr.querySelector('.p').value, quantity: +tr.querySelector('.q').value, unit_price: +tr.querySelector('.u').value }));
  const v = await api('/invoices', { method: 'POST', body: { invoice_no: inv.value.trim(), delivery_note_no: dn.value.trim() || undefined, issue_date: idt.value || undefined, customer_id: +cu.value, due_date: dd.value || undefined, notes: nt.value || undefined, items } });
  alert('Created ' + v.invoice_no); location.href = '/invoices.html';
} catch (err) { notify(err.message); } };
(async () => { if (!init('invoice-new')) return; idt.value = today(); try {
  const [c, p] = await Promise.all([api('/customers'), api('/products')]); P = p;
  cu.innerHTML = c.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('');
  if (!c.length || !p.length) notify('Add at least one customer and one product first.', 'warning'); else addRow();
} catch (e) { notify(e.message); } })();
</script></body></html>
