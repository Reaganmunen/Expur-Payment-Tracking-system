<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoices · Expur</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3EE%3C/text%3E%3C/svg%3E"></head><body><div id="nav"></div><div class="container pb-5"><div id="alerts"></div>
<div class="d-flex justify-content-between mb-3"><h4>Invoices</h4>
<div class="d-flex gap-2"><input id="q" class="form-control" placeholder="Search invoice no., delivery note, customer"><select id="st" class="form-select w-auto"><option value="">All</option><option value="outstanding">Outstanding</option><option>unpaid</option><option>partial</option><option>overdue</option><option>paid</option></select></div></div>
<div class="table-responsive"><table class="table table-hover bg-white"><thead><tr><th>Invoice no.</th><th>Delivery note</th><th>Customer</th><th>Date</th><th>Due</th><th class="text-end">Total</th><th class="text-end">Balance</th><th>Status</th><th>Seller</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="modal fade" id="md"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-body" id="mb"></div></div></div></div>
</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script><script>
let modal;
async function load() { try {
  const qs = new URLSearchParams(); if (st.value) qs.set('status', st.value); if (q.value.trim()) qs.set('search', q.value.trim());
  const l = await api('/invoices' + (qs.toString() ? '?' + qs : ''));
  rows.innerHTML = l.map(i => `<tr role="button" onclick="open_(${i.id})"><td>${esc(i.invoice_no)}</td><td>${esc(i.delivery_note_no || '')}</td><td>${esc(i.customer)}</td><td>${i.issue_date}</td><td>${i.due_date}</td><td class="text-end">${kes(i.total)}</td><td class="text-end">${kes(i.balance)}</td><td>${badge(i.status)}</td><td>${esc(i.seller || '')}</td></tr>`).join('') || '<tr><td colspan=9 class="text-muted">No invoices</td></tr>';
} catch (e) { notify(e.message); } }
async function open_(id) { try {
  const v = await api('/invoices/' + id), canPay = v.balance > 0 && v.status !== 'WRITTEN_OFF';
  mb.innerHTML = `<div class="d-flex justify-content-between"><h5>${esc(v.invoice_no)} ${badge(v.status)}</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <p class="text-muted">${esc(v.customer)} · Delivery note: ${esc(v.delivery_note_no || '—')} · due ${v.due_date}</p>
  <table class="table table-sm"><tr><th>Item</th><th>Qty</th><th class="text-end">Price</th><th class="text-end">Total</th></tr>${v.items.map(i => `<tr><td>${esc(i.product)}</td><td>${i.quantity}</td><td class="text-end">${kes(i.unit_price)}</td><td class="text-end">${kes(i.line_total)}</td></tr>`).join('')}</table>
  <p class="text-end mb-1">Total <b>${kes(v.total)}</b> · Paid ${kes(v.paid)} · Balance <b>${kes(v.balance)}</b></p>
  <h6>Payments</h6><ul class="list-group mb-3">${v.payments.map(p => `<li class="list-group-item d-flex justify-content-between"><span>${new Date(p.paid_at).toLocaleDateString()} · ${p.method} ${esc(p.reference || '')}</span><b>${kes(p.amount)}</b></li>`).join('') || '<li class="list-group-item text-muted">None yet</li>'}</ul>
  ${canPay ? `<form class="row g-2" onsubmit="pay(event,${v.id})"><div class="col-4"><input id="pa" type="number" step="0.01" max="${v.balance}" class="form-control" placeholder="Amount" required></div>
  <div class="col-3"><select id="pm" class="form-select"><option>mpesa</option><option>cash</option><option>bank</option><option>cheque</option></select></div>
  <div class="col-3"><input id="pr" class="form-control" placeholder="M-Pesa code"></div><div class="col-2"><button class="btn btn-success w-100">Pay</button></div></form>` : ''}
  ${isAdmin() ? `<button class="btn btn-sm btn-outline-danger mt-3" onclick="wo(${v.id},${v.status === 'WRITTEN_OFF'})">${v.status === 'WRITTEN_OFF' ? 'Reverse write-off' : 'Write off as bad debt'}</button>` : ''}`;
  (modal ||= new bootstrap.Modal(md)).show();
} catch (e) { notify(e.message); } }
async function pay(e, id) { e.preventDefault(); try {
  await api('/payments', { method: 'POST', body: { invoice_id: id, amount: +pa.value, method: pm.value, reference: pr.value || undefined } });
  await load(); open_(id);
} catch (err) { notify(err.message); modal.hide(); } }
async function wo(id, rev) { if (!confirm(rev ? 'Reverse write-off?' : 'Write off this invoice as bad debt?')) return; try {
  await api('/invoices/' + id + '/write-off', { method: rev ? 'DELETE' : 'POST' }); await load(); open_(id); } catch (e) { notify(e.message); } }
st.onchange = load; q.oninput = () => { clearTimeout(window.qt); window.qt = setTimeout(load, 300); }; if (init('invoices')) load();
</script></body></html>
