<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customers - Expur</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2317151f'/%3E%3Ctext x='16' y='22.5' font-family='Arial' font-weight='700' font-size='18' text-anchor='middle' fill='white'%3EE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="view" id="view"><div class="stack">
  <section class="card"><div class="card-h">Add a customer</div><div class="card-b">
    <form id="f" class="form-grid" novalidate>
      <div class="field c4"><label for="n">Name</label><input class="in" id="n" required maxlength="120" autocomplete="off"></div>
      <div class="field c3"><label for="p">Phone</label><input class="in" id="p" inputmode="tel" autocomplete="off"></div>
      <div class="field c3"><label for="e">Email</label><input class="in" id="e" type="email" autocomplete="off"></div>
      <div class="field c2"><label>&nbsp;</label><button class="btn primary" style="height:40px" type="submit">Add customer</button></div>
    </form></div></section>
  <section class="card"><div class="tbl-wrap" id="list"><div class="empty">Loading...</div></div></section>
</div></main>
<script src="/js/app.js"></script>
<script>
let all = [];
function draw() {
  const t = ($('#gsearch').value || '').trim().toLowerCase();
  const rows = all.filter((c) => !t || [c.name, c.phone, c.email].some((v) => String(v || '').toLowerCase().includes(t)));
  if (!rows.length) { $('#list').innerHTML = `<div class="empty"><b>${all.length ? 'No customers match' : 'No customers yet'}</b>${all.length ? 'Try a different search.' : 'Add your first customer above.'}</div>`; return; }
  $('#list').innerHTML = `<table class="tbl"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th class="right">Owes you</th></tr></thead><tbody>${rows.map((c) => `
    <tr><td><b style="font-weight:600">${esc(c.name)}</b></td><td>${esc(c.phone || '')}</td><td>${esc(c.email || '')}</td>
    <td class="right">${Number(c.outstanding) > 0 ? `<b style="color:var(--bad);font-weight:600">${kes(c.outstanding)}</b>` : '<span class="dim">-</span>'}</td></tr>`).join('')}</tbody></table>`;
}
async function load() { try { all = await api('/customers'); draw(); } catch (e) { notify(e.message, 'bad'); } }
$('#f').onsubmit = async (ev) => {
  ev.preventDefault();
  if (!$('#n').value.trim()) return notify('Enter the customer name.', 'bad');
  try { await api('/customers', { method: 'POST', body: { name: $('#n').value.trim(), phone: $('#p').value.trim() || undefined, email: $('#e').value.trim() || undefined } }); ev.target.reset(); notify('Customer added'); load(); }
  catch (err) { notify(err.message, 'bad'); }
};
if (init({ active: 'customers', title: 'Customers', search: true })) {
  $('#gsearch').placeholder = 'Search customers';
  $('#gsearch').addEventListener('input', draw); window.onSearch = draw; load();
}
</script>
</body>
</html>
