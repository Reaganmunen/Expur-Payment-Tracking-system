<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customers · Expur</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3EE%3C/text%3E%3C/svg%3E"></head><body><div id="nav"></div><div class="container pb-5"><div id="alerts"></div>
<div class="d-flex justify-content-between mb-3"><h4>Customers</h4></div>
<form id="f" class="row g-2 mb-3"><div class="col-md-4"><input id="n" class="form-control" placeholder="Name" required></div><div class="col-md-3"><input id="p" class="form-control" placeholder="Phone"></div><div class="col-md-3"><input id="e" type="email" class="form-control" placeholder="Email"></div><div class="col-md-2"><button class="btn btn-primary w-100">Add</button></div></form>
<table class="table bg-white"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th class="text-end">Owes</th></tr></thead><tbody id="rows"></tbody></table>
</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script><script>
async function load() { try { const l = await api('/customers');
  rows.innerHTML = l.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.phone || '')}</td><td>${esc(c.email || '')}</td><td class="text-end ${c.outstanding > 0 ? 'text-danger fw-bold' : ''}">${kes(c.outstanding)}</td></tr>`).join('');
} catch (e) { notify(e.message); } }
f.onsubmit = async (ev) => { ev.preventDefault(); try { await api('/customers', { method: 'POST', body: { name: n.value, phone: p.value, email: e.value } }); f.reset(); load(); } catch (err) { notify(err.message); } };
if (init('customers')) load();
</script></body></html>
