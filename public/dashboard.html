<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · Expur</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3EE%3C/text%3E%3C/svg%3E"></head><body><div id="nav"></div><div class="container pb-5"><div id="alerts"></div>
<h4 class="mb-3">Dashboard</h4><div class="row g-3 mb-4" id="cards"></div><div id="extra"></div>
</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script><script>
const card = (t, v, c = '') => `<div class="col-6 col-lg-3"><div class="card kpi"><div class="card-body"><div class="text-muted small">${t}</div><div class="fs-5 fw-bold ${c}">${v}</div></div></div></div>`;
(async () => { if (!init('dashboard')) return;
 try {
  if (isAdmin()) {
   const [d, od, by] = await Promise.all([api('/reports/dashboard'), api('/reports/overdue'), api('/reports/sales-by-user')]);
   cards.innerHTML = card('Outstanding', kes(d.outstanding)) + card('Overdue (' + d.overdue_count + ')', kes(d.overdue), 'text-danger') +
    card('Collected this month', kes(d.collected_this_month), 'text-success') + card('Revenue this month', kes(d.revenue_this_month)) +
    card('Expenses this month', kes(d.expenses_this_month)) +
    card('Net profit this month', kes(d.net_profit_this_month), d.net_profit_this_month < 0 ? 'text-danger' : 'text-success');
   extra.innerHTML = '<h6>Overdue invoices</h6><table class="table table-sm bg-white"><tr><th>No.</th><th>Customer</th><th>Days late</th><th class="text-end">Balance</th></tr>' +
    (od.map(i => `<tr><td>${esc(i.invoice_no)}</td><td>${esc(i.customer)}</td><td>${i.days_overdue}</td><td class="text-end">${kes(i.balance)}</td></tr>`).join('') || '<tr><td colspan=4 class="text-muted">None</td></tr>') +
    '</table><h6 class="mt-4">Sales by seller</h6><table class="table table-sm bg-white"><tr><th>Seller</th><th>Invoices</th><th class="text-end">Sales</th><th class="text-end">Collected</th><th class="text-end">Outstanding</th><th class="text-end">Gross profit</th></tr>' +
    by.map(s => `<tr><td>${esc(s.seller)}</td><td>${s.invoices}</td><td class="text-end">${kes(s.total_sales)}</td><td class="text-end">${kes(s.collected)}</td><td class="text-end">${kes(s.outstanding)}</td><td class="text-end">${kes(s.gross_profit)}</td></tr>`).join('') + '</table>';
  } else {
   const s = await api('/reports/my-sales');
   cards.innerHTML = card('My invoices', s.invoices) + card('My sales', kes(s.total_sales)) + card('Collected', kes(s.collected), 'text-success') + card('Outstanding', kes(s.outstanding), 'text-danger');
  }
 } catch (e) { notify(e.message); } })();
</script></body></html>
