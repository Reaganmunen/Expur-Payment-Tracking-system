<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products - Expur</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2317151f'/%3E%3Ctext x='16' y='22.5' font-family='Arial' font-weight='700' font-size='18' text-anchor='middle' fill='white'%3EE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="view" id="view"><div class="stack">
  <section class="card"><div class="card-h">Add a product</div><div class="card-b">
    <form id="f" class="form-grid" novalidate>
      <div class="field c5"><label for="n">Name</label><input class="in" id="n" placeholder="e.g. Fresh cream 500ml" required maxlength="120" autocomplete="off"></div>
      <div class="field c2"><label for="u">Unit</label><input class="in" id="u" value="pc" maxlength="20"></div>
      <div class="field c2"><label for="c">Cost (KES)</label><input class="in" id="c" type="number" min="0" step="0.01" required></div>
      <div class="field c2"><label for="p">Price (KES)</label><input class="in" id="p" type="number" min="0" step="0.01" required></div>
      <div class="field c12"><button class="btn primary" style="height:40px;justify-self:start" type="submit">Add product</button></div>
    </form></div></section>
  <section class="card"><div class="tbl-wrap" id="list"><div class="empty">Loading...</div></div></section>
</div></main>
<script src="/js/app.js"></script>
<script>
async function load() {
  try {
    const l = await api('/products');
    if (!l.length) { $('#list').innerHTML = '<div class="empty"><b>No products yet</b>Add the first one above.</div>'; return; }
    $('#list').innerHTML = `<table class="tbl"><thead><tr><th>Name</th><th>Unit</th><th class="right">Cost</th><th class="right">Price</th><th class="right">Margin</th><th></th></tr></thead><tbody>${l.map((x) => `
      <tr><td><b style="font-weight:600">${esc(x.name)}</b></td><td>${esc(x.unit)}</td><td class="right">${kes(x.unit_cost)}</td><td class="right">${kes(x.unit_price)}</td>
      <td class="right" style="color:${Number(x.unit_margin) < 0 ? 'var(--bad)' : 'inherit'}">${kes(x.unit_margin)}</td>
      <td class="right"><button class="btn sm danger" data-del="${x.id}" data-name="${esc(x.name)}">Remove</button></td></tr>`).join('')}</tbody></table>`;
  } catch (e) { notify(e.message, 'bad'); }
}
$('#list').onclick = async (e) => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  if (!(await confirmBox('Old invoices that used it keep it.', { title: `Remove ${b.dataset.name}?`, ok: 'Remove', danger: true }))) return;
  try { await api('/products/' + b.dataset.del, { method: 'DELETE' }); notify('Product removed'); load(); } catch (err) { notify(err.message, 'bad'); }
};
$('#f').onsubmit = async (ev) => {
  ev.preventDefault();
  if (!$('#n').value.trim()) return notify('Enter the product name.', 'bad');
  try { await api('/products', { method: 'POST', body: { name: $('#n').value.trim(), unit: $('#u').value.trim() || 'pc', unit_cost: +$('#c').value, unit_price: +$('#p').value } }); ev.target.reset(); $('#u').value = 'pc'; notify('Product added'); load(); }
  catch (err) { notify(err.message, 'bad'); }
};
if (init({ active: 'products', title: 'Products', adminOnly: true })) load();
</script>
</body>
</html>
