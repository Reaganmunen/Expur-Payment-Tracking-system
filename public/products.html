<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products · Expur</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3EE%3C/text%3E%3C/svg%3E"></head><body><div id="nav"></div><div class="container pb-5"><div id="alerts"></div>
<h4 class="mb-3">Products</h4>
<form id="f" class="row g-2 mb-3"><div class="col-md-4"><input id="n" class="form-control" placeholder="Name e.g. Fresh cream 500ml" required></div><div class="col-md-2"><input id="u" class="form-control" placeholder="Unit" value="pc"></div>
<div class="col-md-2"><input id="c" type="number" min="0" step="0.01" class="form-control" placeholder="Cost" required></div><div class="col-md-2"><input id="p" type="number" min="0" step="0.01" class="form-control" placeholder="Price" required></div><div class="col-md-2"><button class="btn btn-primary w-100">Add</button></div></form>
<table class="table bg-white"><thead><tr><th>Name</th><th>Unit</th><th class="text-end">Cost</th><th class="text-end">Price</th><th class="text-end">Margin</th><th></th></tr></thead><tbody id="rows"></tbody></table>
</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script><script>
async function load() { try { const l = await api('/products');
  rows.innerHTML = l.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.unit)}</td><td class="text-end">${kes(x.unit_cost)}</td><td class="text-end">${kes(x.unit_price)}</td><td class="text-end">${kes(x.unit_margin)}</td><td><button class="btn btn-sm btn-outline-danger" onclick="del(${x.id})">Remove</button></td></tr>`).join('');
} catch (e) { notify(e.message); } }
async function del(id) { if (confirm('Remove this product? Old invoices keep it.')) { try { await api('/products/' + id, { method: 'DELETE' }); load(); } catch (e) { notify(e.message); } } }
f.onsubmit = async (ev) => { ev.preventDefault(); try { await api('/products', { method: 'POST', body: { name: n.value, unit: u.value, unit_cost: +c.value, unit_price: +p.value } }); f.reset(); u.value = 'pc'; load(); } catch (err) { notify(err.message); } };
if (init('products', true)) load();
</script></body></html>
