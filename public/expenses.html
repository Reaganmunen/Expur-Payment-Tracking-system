<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expenses · Expur</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3EE%3C/text%3E%3C/svg%3E"></head><body><div id="nav"></div><div class="container pb-5"><div id="alerts"></div>
<h4 class="mb-3">Expenses</h4>
<form id="f" class="row g-2 mb-3"><div class="col-md-3"><select id="c" class="form-select" required></select></div>
<div class="col-md-2"><input id="a" type="number" min="1" step="0.01" class="form-control" placeholder="Amount" required></div>
<div class="col-md-3"><input id="d" class="form-control" placeholder="Description (e.g. Fuel to Thika)"></div>
<div class="col-md-2"><input id="dt" type="date" class="form-control"></div>
<div class="col-md-1"><select id="v" class="form-select"><option>cash</option><option>mpesa</option><option>bank</option></select></div>
<div class="col-md-1"><button class="btn btn-primary w-100">Add</button></div></form>
<table class="table bg-white"><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Paid via</th><th>By</th><th class="text-end">Amount</th></tr></thead><tbody id="rows"></tbody><tfoot><tr><th colspan="5">Total</th><th class="text-end" id="tot"></th></tr></tfoot></table>
</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script><script>
async function load() { try { const l = await api('/expenses');
  rows.innerHTML = l.map(x => `<tr><td>${x.expense_date}</td><td>${esc(x.category)}</td><td>${esc(x.description || '')}</td><td>${x.paid_via}</td><td>${esc(x.recorded_by_name || '')}</td><td class="text-end">${kes(x.amount)}</td></tr>`).join('');
  tot.textContent = kes(l.reduce((s, x) => s + x.amount, 0));
} catch (e) { notify(e.message); } }
f.onsubmit = async (ev) => { ev.preventDefault(); try {
  await api('/expenses', { method: 'POST', body: { category_id: +c.value, amount: +a.value, description: d.value || undefined, expense_date: dt.value || undefined, paid_via: v.value } });
  a.value = d.value = ''; load(); } catch (err) { notify(err.message); } };
(async () => { if (!init('expenses')) return; dt.value = today();
  try { c.innerHTML = (await api('/expenses/categories')).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join(''); } catch (e) { notify(e.message); }
  load(); })();
</script></body></html>
