<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expenses - Expur</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2317151f'/%3E%3Ctext x='16' y='22.5' font-family='Arial' font-weight='700' font-size='18' text-anchor='middle' fill='white'%3EE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="view" id="view"><div class="stack">
  <section class="card"><div class="card-h">Record an expense</div><div class="card-b">
    <form id="f" class="form-grid" novalidate>
      <div class="field c3"><label for="c">Category</label><select class="in" id="c" required></select></div>
      <div class="field c3"><label for="a">Amount (KES)</label><input class="in" id="a" type="number" min="1" step="0.01" required></div>
      <div class="field c3"><label for="dt">Date</label><input class="in" id="dt" type="date"></div>
      <div class="field c3"><label for="v">Paid via</label><select class="in" id="v"><option value="cash">Cash</option><option value="mpesa">M-Pesa</option><option value="bank">Bank</option></select></div>
      <div class="field c8"><label for="d">Description</label><input class="in" id="d" placeholder="e.g. Fuel to Thika" maxlength="200" autocomplete="off"></div>
      <div class="field c4"><label>&nbsp;</label><button class="btn primary" style="height:40px" type="submit">Add expense</button></div>
    </form></div></section>
  <section class="card"><div class="tbl-wrap" id="list"><div class="empty">Loading...</div></div></section>
</div></main>
<script src="/js/app.js"></script>
<script>
const via = { cash: 'Cash', mpesa: 'M-Pesa', bank: 'Bank' };
async function load() {
  try {
    const l = await api('/expenses');
    if (!l.length) { $('#list').innerHTML = '<div class="empty"><b>No expenses yet</b>Add the first one above.</div>'; return; }
    $('#list').innerHTML = `<table class="tbl"><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Paid via</th><th>Added by</th><th class="right">Amount</th></tr></thead><tbody>${l.map((x) => `
      <tr><td>${fmtDate(x.expense_date)}</td><td>${esc(x.category)}</td><td>${esc(x.description || '')}</td><td>${via[x.paid_via] || esc(x.paid_via)}</td><td>${esc(x.recorded_by_name || '')}</td><td class="right">${kes(x.amount)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><th colspan="5">Total</th><td class="right">${kes(l.reduce((s, x) => s + Number(x.amount), 0))}</td></tr></tfoot></table>`;
  } catch (e) { notify(e.message, 'bad'); }
}
$('#f').onsubmit = async (ev) => {
  ev.preventDefault();
  if (!(+$('#a').value > 0)) return notify('Enter an amount.', 'bad');
  try {
    await api('/expenses', { method: 'POST', body: { category_id: +$('#c').value, amount: +$('#a').value, description: $('#d').value.trim() || undefined, expense_date: $('#dt').value || undefined, paid_via: $('#v').value } });
    $('#a').value = $('#d').value = ''; notify('Expense added'); load();
  } catch (err) { notify(err.message, 'bad'); }
};
(async () => {
  if (!init({ active: 'expenses', title: 'Expenses' })) return;
  $('#dt').value = today();
  try { $('#c').innerHTML = (await api('/expenses/categories')).map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join(''); } catch (e) { notify(e.message, 'bad'); }
  load();
})();
</script>
</body>
</html>
